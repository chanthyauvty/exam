/* ---- Exam App UI Kit (exam-app-ui-kit/ui-kit.css) ---- */
/* ==========================================================================
   Exam App UI Kit — design tokens + reusable components

   ========================================================================== */
:root{
  --n:#0f2a4a;        /* navy — text, primary buttons */
  --n-700:#173b66; --n-500:#2d6cb5;
  --mu:#64748b;       /* muted text */
  --li:#94a3b8;       /* light text / placeholders */
  --bd:#e6eaf0;       /* borders */
  --sf:#f5f7fa;       /* soft surface */
  --a:#1fae82;        /* mint accent */
  --a-300:#3ccf9f; --a1:#e8f8f2;
  --blue:#1f8fd1;
  --warn:#d97706; --danger:#e11d48;
  --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:22px;
}
body{font-family:"Noto Sans Khmer","Khmer OS Battambang",system-ui,sans-serif;background:#fff;color:var(--n);-webkit-font-smoothing:antialiased}

/* Icon tile (soft / neumorphic) — wrap an SVG icon that uses url(#gi) / url(#gn) / url(#gw) */
.tl{flex:none;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff,#eef2f6);
  box-shadow:6px 6px 14px rgba(15,42,74,.12),-5px -5px 12px #fff,inset 0 1px 0 #fff}
.tl svg{width:50%;height:50%}
.tl-sm{width:32px;height:32px;border-radius:10px}
.tl-lg{width:76px;height:76px;border-radius:22px}

/* Buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;transition:filter .15s,background .15s}
.btn-primary{background:linear-gradient(135deg,var(--n-700),var(--n));color:#fff;box-shadow:0 8px 16px -8px rgba(15,42,74,.6)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:#fff;color:var(--n);border:1px solid var(--bd)}
.btn-ghost:hover{background:var(--sf)}
.btn-ai{background:linear-gradient(135deg,var(--a-300),var(--blue));color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Cards & panels */
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px}
.card-raised{box-shadow:0 20px 40px -24px rgba(15,42,74,.25)}
.panel-navy{border-radius:var(--r-xl);background:linear-gradient(150deg,#1d4a7d,var(--n-700) 40%,var(--n));color:#fff;padding:20px}
.panel-navy .muted{color:#9fb4cc}

/* Input with leading icon */
.field{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:var(--r);padding:4px 14px;background:#fff}
.field:focus-within{border-color:var(--n);box-shadow:0 0 0 3px rgba(15,42,74,.07)}
.field svg{width:18px;height:18px;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;padding:10px 0;color:var(--n);background:none}

/* Segmented control (សិស្ស | គ្រូ) */
.seg{display:inline-flex;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;font:inherit;color:var(--mu);padding:7px 16px;border-radius:8px;cursor:pointer}
.seg .on{background:#fff;color:var(--n);font-weight:600;box-shadow:0 1px 2px rgba(15,42,74,.08)}

/* Badges */
.badge{border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-open{background:var(--a1);color:var(--a)}      /* កំពុងបើក */
.badge-draft{background:#eef3f9;color:var(--n-500)}   /* ព្រាង */
.badge-closed{background:#f1f5f9;color:var(--mu)}     /* បានបិទ */
.badge-review{background:#fff4e5;color:var(--warn)}   /* រង់ចាំពិនិត្យ */
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--a);background:var(--a1);border-radius:99px;padding:3px 10px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--a);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}

/* Exam screen */
.timer{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--n-700),var(--n));color:#fff;border-radius:12px;padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--sf)}.progress>div{height:100%;background:linear-gradient(90deg,var(--a-300),var(--blue));transition:width .3s}
.qchip{width:38px;height:38px;border-radius:12px;border:0;font:inherit;font-weight:700;color:var(--mu);cursor:pointer;
  background:linear-gradient(145deg,#fff,#eef2f6);box-shadow:4px 4px 10px rgba(15,42,74,.1),-3px -3px 8px #fff}
.qchip.answered{color:var(--a);box-shadow:inset 0 0 0 1.5px var(--a),4px 4px 10px rgba(15,42,74,.1)}
.qchip.current{background:linear-gradient(135deg,var(--n-700),var(--n));color:#fff}
.option{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:var(--r);padding:11px 12px;margin-bottom:9px;font:inherit;color:var(--n);cursor:pointer}
.option .letter{flex:none;width:28px;height:28px;border-radius:10px;text-align:center;line-height:28px;font-size:13px;background:linear-gradient(145deg,#fff,#eef2f6);box-shadow:3px 3px 7px rgba(15,42,74,.12),-2px -2px 5px #fff}
.option.selected{border-color:var(--a);background:var(--a1);font-weight:700}
.option.selected .letter{background:linear-gradient(135deg,var(--a-300),var(--blue));color:#fff;box-shadow:none}
.read-lock{display:flex;align-items:center;gap:8px;border-radius:12px;background:#fff8eb;color:#b45309;padding:9px 11px;font-size:12.5px;font-weight:600}

/* Teacher sidebar */
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:var(--mu);padding:7px 8px;border-radius:12px;cursor:pointer;width:100%;text-align:left}
.nav-item.on{background:var(--sf);color:var(--n);font-weight:700}
/* ---- app overrides ---- */
  body { font-family: 'Noto Sans Khmer', system-ui, sans-serif; background: #fff; color: #0f2a4a; line-height: 1.7; }
  .lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}.lg i{width:18px;height:18px;border-radius:5px;background:#0f2a4a;position:relative;flex:none}.lg i:after{content:'';position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:3px;background:#1fae82;border:2px solid #fff}
  .nav-item .tl{width:32px;height:32px;border-radius:10px;box-shadow:3px 3px 7px rgba(15,42,74,.1),-2px -2px 6px #fff}.nav-item .tl svg{width:16px;height:16px}
  .nav-item em{margin-left:auto;font-style:normal;background:#fff4e5;color:#d97706;border-radius:99px;padding:0 7px;font-size:11px;font-weight:700}
  .tl-40{width:40px;height:40px;border-radius:13px}.tl-34{width:34px;height:34px;border-radius:11px}.tl-34 svg{width:16px;height:16px}
  .bnav svg{width:20px;height:20px}
  textarea, input, select, button { font-family: inherit; }
  html { -webkit-text-size-adjust: 100%; }
  body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-bottom: env(safe-area-inset-bottom); }
  @media (max-width: 640px) { .inp { font-size: 16px; min-height: 42px; } }
  @media (hover: none) { button, a { -webkit-tap-highlight-color: transparent; } }
  .inp { width: 100%; border: 1px solid #e6eaf0; border-radius: 12px; padding: 0.45rem 0.8rem; background: #fff; outline: none; color: #0f2a4a; }
  .inp:focus { border-color: #0f2a4a; box-shadow: 0 0 0 3px rgba(15,42,74,.07); }
  fieldset:disabled .inp { background: #f1f5f9; color: #475569; }
  #busy { position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 60; background: linear-gradient(90deg,#22c58b,#1d4a9a,#22c58b); background-size: 200% 100%; animation: slide 1s linear infinite; display: none; }
  @keyframes slide { from { background-position: 0 0; } to { background-position: -200% 0; } }
  .pre { white-space: pre-wrap; word-break: break-word; }
  @media print { header, aside, .no-print, #busy, #toasts { display: none !important; } body { background: #fff; } }
</style>

function toast(msg, kind) {

  $('#toasts').append(t);
  setTimeout(function () { t.remove(); }, kind === 'error' ? 6000 : 3000);
}
function btn(label, kind, onclick, extra) {

    primary: 'btn-primary text-white font-semibold',
    navy: 'btn-primary text-white font-semibold',
    ghost: 'bg-white hover:bg-navy-50 text-navy-900 border border-line',
    danger: 'bg-white hover:bg-rose-50 text-rose-600 border border-rose-200',
    soft: 'bg-mint-100 hover:bg-[#d7f3e8] text-mint-500 font-semibold'
  }[kind || 'ghost'];

}
function badge(text, cls) { return h('span', { class: 'inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold whitespace-nowrap ' + cls }, text); }
function field(label, input, hint) {
  return h('label', { class: 'block mb-3' },
    h('span', { class: 'block text-sm font-medium text-navy-800 mb-1' }, label),
    input,
    hint ? h('span', { class: 'block text-xs text-slate-500 mt-1' }, hint) : null);
}
function modal(title, body, buttons, opts) {
  opts = opts || {};
  var overlay = h('div', { class: 'fixed inset-0 z-[60] bg-navy-900/55 backdrop-blur-sm flex items-start justify-center p-3 overflow-y-auto' });
  function close() { overlay.remove(); }
  var foot = h('div', { class: 'flex flex-wrap justify-end gap-2 px-5 py-3 border-t border-line rounded-b-[22px]' });
  (buttons || []).forEach(function (b) {
    var el = btn(b.label, b.kind, function () {
      el.disabled = true;
      Promise.resolve(b.onClick ? b.onClick(close) : undefined)
        .then(function (r) { if (r !== false) close(); else el.disabled = false; })
        .catch(function (e) { toast(e.message, 'error'); el.disabled = false; });
    });
    foot.append(el);
  });
  var box = h('div', { class: 'bg-white rounded-[22px] shadow-2xl w-full my-6 ' + (opts.wide ? 'max-w-3xl' : 'max-w-lg') },
    h('div', { class: 'flex items-center justify-between px-5 py-3 border-b border-line' },
      h('h3', { class: 'font-bold text-navy-900' }, title),
      h('button', { type: 'button', class: 'text-slate-400 hover:text-navy-900 text-xl leading-none', onclick: close }, '✕')),
    h('div', { class: 'p-5' }, body),
    (buttons && buttons.length) ? foot : null);
  overlay.append(box);
  document.body.append(overlay);
  return { close: close };
}
function confirmBox(title, message, okLabel, danger) {
  return new Promise(function (resolve) {
    var done = false;
    var m = modal(title, h('p', { class: 'pre' }, message), [
      { label: 'បោះបង់', kind: 'ghost', onClick: function () { if (!done) { done = true; resolve(false); } } },
      { label: okLabel || 'បញ្ជាក់', kind: danger ? 'danger' : 'primary', onClick: function () { done = true; resolve(true); } }
    ]);

}
function copyText(text) {
  var ta = h('textarea', { style: 'position:fixed;opacity:0;top:0;left:0' });
  ta.value = text; document.body.append(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();

function fmtDate(iso) {

var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var xlsxP = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxP) xlsxP = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = XLSX_URL;
    s.onload = function () { window.XLSX ? resolve(window.XLSX) : reject(new Error('x')); };
    s.onerror = function () { xlsxP = null; reject(new Error('មិនអាចផ្ទុកកម្មវិធីអាន Excel បានទេ។ សូមពិនិត្យអ៊ីនធឺណិត។')); };
    document.head.appendChild(s);
  });
  return xlsxP;
}
function sheetOf(X, rows, widths) {
  var ws = X.utils.aoa_to_sheet(rows);
  ws['!cols'] = widths.map(function (w) { return { wch: w }; });
  return ws;
}
function saveBook(X, wb, filename) {
  try { X.writeFile(wb, filename); toast('បានទាញយក ' + filename); }
  catch (e) { toast('មិនអាចទាញយកបានទេ (browser បិទការទាញយក)។ សូមសាកល្បង browser ផ្សេង។', 'error'); }
}
// Read the FIRST sheet of an uploaded .xlsx/.xls/.csv as an array of rows (strings).
function pickSheetFile(onRows) {
  var inp = h('input', { type: 'file', accept: '.xlsx,.xls,.csv', style: 'display:none' });
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('ឯកសារធំពេក (អតិបរមា 5MB)។', 'error'); return; }
    busy(1);
    loadXlsx().then(function (X) {
      return new Promise(function (resolve, reject) {
        var rd = new FileReader();
        rd.onload = function () {
          try {
            var wb = X.read(new Uint8Array(rd.result), { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            resolve(X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: false }));
          } catch (e) { reject(new Error('មិនអាចអានឯកសារនេះបានទេ។ សូមប្រើឯកសារគំរូ (.xlsx)។')); }
        };
        rd.onerror = function () { reject(new Error('មិនអាចអានឯកសារបានទេ។')); };
        rd.readAsArrayBuffer(f);
      });
    }).then(function (rows) {
      busy(-1);
      rows = rows.map(function (r) { return r.map(function (c) { return String(c === null || c === undefined ? '' : c).trim(); }); });
      onRows(rows);
    }).catch(function (e) { busy(-1); toast(e.message, 'error'); });
  });
  document.body.append(inp);
  inp.click();
}
function isHeaderRow(r, words) { var s = r.join(' ').toLowerCase(); return words.some(function (w) { return s.indexOf(w) >= 0; }); }

// Convert one template row to the same item shape the AI import uses ({type,text,options,answer,…}).
function rowToItem(r) {
  var rawType = String(r[0] || '').trim(), key = rawType.toLowerCase().replace(/\s+/g, ' ');
  var type = TYPE_ALIASES[key] || TYPE_ALIASES[key.replace(/\s/g, '')] || rawType.toUpperCase();
  var opts = r.slice(2, 8).map(function (x) { return String(x || '').trim(); }).filter(Boolean);
  var ans = String(r[8] || '').trim();
  var it = { type: type, text: String(r[1] || '').trim(), points: r[9] ? Number(String(r[9]).replace(',', '.')) : undefined };
  if (type === 'MCQ') {
    var KL = 'កខគឃងច', idx = -1;
    if (ans.length === 1 && KL.indexOf(ans) >= 0) idx = KL.indexOf(ans);
    else if (/^[A-Fa-f]$/.test(ans)) idx = ans.toUpperCase().charCodeAt(0) - 65;
    else if (/^[1-6]$/.test(ans)) idx = Number(ans) - 1;
    it.options = opts; it.answer = idx >= 0 ? (opts[idx] || ans) : ans;
  } else if (type === 'TRUE_FALSE') {
    it.answer = /^(ពិត|true|t|1|ត្រូវ)$/i.test(ans) ? 'true' : (/^(មិនពិត|false|f|0|ខុស)$/i.test(ans) ? 'false' : ans);
  } else if (type === 'FILL_BLANK') {
    var acc = ans.split(/\s*[|;]\s*/).filter(Boolean);
    it.answer = acc[0] || ''; it.accepted_answers = acc.slice(1);
  } else if (type === 'MATCHING') {
    it.pairs = opts.map(function (o) {
      var m = o.split(/\s*(?:=>|=|→)\s*/);
      return { left: (m[0] || '').trim(), right: m.slice(1).join(' = ').trim() };
    });
  } else {
    it.answer = ans; it.rubric = String(r[10] || '').trim();
  }
  return it;
}
function importQuestionsFile() {
  pickSheetFile(function (rows) {
    if (rows.length && isHeaderRow(rows[0], ['ប្រភេទ', 'type', 'សំណួរ'])) rows = rows.slice(1);
    var items = [], rowNo = [];
    rows.forEach(function (r, i) { if (!r[0] && !r[1]) return; items.push(rowToItem(r)); rowNo.push(i + 2); });

// ---------- PISA mode (shared by "import from AI" and "generate with Key") ----------
// Keep the wording in sync with pisaRules_() in Teacher_Code.gs.
var PISA_DOMAINS = {
  science: ['វិទ្យាសាស្ត្រ', 'Scientific literacy', 'explain phenomena scientifically; evaluate and design scientific enquiry; interpret data and evidence scientifically'],
  math: ['គណិតវិទ្យា', 'Mathematical literacy', 'formulate situations mathematically; employ mathematical concepts, facts and procedures; interpret, apply and evaluate mathematical outcomes; mathematical reasoning'],
  reading: ['អំណាន', 'Reading literacy', 'locate information; understand (literal and inferential); evaluate and reflect on content and form']
};
var PISA_LEVELS = { low: ['កម្រិត ១–២ (ងាយ)', 'levels 1-2'], mid: ['កម្រិត ៣–៤ (មធ្យម)', 'levels 3-4'], high: ['កម្រិត ៥–៦ (ពិបាក)', 'levels 5-6'], mixed: ['ចម្រុះ (២–៥)', 'a spread from level 2 to level 5'] };
var PISA_TYPE_HINT = {
  MCQ: 'MCQ (one correct answer out of 4)',
  TRUE_FALSE: 'TRUE_FALSE (several yes/no statements per unit, like PISA "complex multiple choice")',
  FILL_BLANK: 'FILL_BLANK (short numeric or one-word answer)',
  MATCHING: 'MATCHING (3 to 6 pairs)',
  OPEN_ENDED: 'OPEN_ENDED (explain / justify)'
};
var PISA_TYPE_ORDER = ['MCQ', 'TRUE_FALSE', 'FILL_BLANK', 'MATCHING', 'OPEN_ENDED'];
var PISA_TYPE_DEFAULT = ['MCQ', 'TRUE_FALSE', 'FILL_BLANK', 'OPEN_ENDED'];
function pisaTypes(types) {
  var ts = PISA_TYPE_ORDER.filter(function (t) { return (types || []).indexOf(t) >= 0; });
  return ts.length ? ts : PISA_TYPE_DEFAULT.slice();
}
function pisaRulesText(domain, units, perUnit, level, types) {
  var d = PISA_DOMAINS[domain] || PISA_DOMAINS.science;
  var ts = pisaTypes(types);
  return 'STYLE: PISA (OECD Programme for International Student Assessment), domain: ' + d[1] + '.\n' +
    '- Build ' + units + ' independent units. Each unit has a short title and ONE authentic real-life stimulus (a personal, local/national or global situation, ' +
    'preferably in a Cambodian context), at most about 700 characters. Images are not possible: describe any table, graph or map in words or as a small text table.\n' +
    '- Each unit has ' + perUnit + ' questions that require APPLYING knowledge and reasoning to the stimulus, not recalling facts.\n' +
    '- Cover these competencies across the questions: ' + d[2] + '.\n' +
    '- Target PISA proficiency ' + (PISA_LEVELS[level] || PISA_LEVELS.mixed)[1] + '.\n' +
    '- Students see ONE question at a time, so the "text" of EVERY question must repeat the unit title and the full stimulus, then a blank line, then the question, exactly:\n' +
    '  "<unit title>\\n<stimulus>\\n\\nសំណួរ៖ <question>"  (keep the whole text under 1800 characters).\n' +
    '- Use ONLY these question formats, spread across the units: ' + ts.map(function (t) { return PISA_TYPE_HINT[t]; }).join('; ') + '.' +
    (ts.indexOf('OPEN_ENDED') >= 0 ? '\n- For OPEN_ENDED, the "rubric" must follow PISA coding guides: Full credit: …; Partial credit: …; No credit: … .' : '');
}
// Style switch + PISA fields. onChange(isPisa) lets the caller hide its normal "count per type" grid.

  var style = h('select', { class: 'inp' }, h('option', { value: 'normal' }, 'ធម្មតា'), h('option', { value: 'pisa' }, 'PISA (ផ្អែកលើស្ថានភាពជីវិតពិត)'));

}
function csvCell(v) {
  var s = String(v === null || v === undefined ? '' : v);

  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCsv() {
  var rows = S.res.rows || [];
  var lines = [['student_id', 'student_name', 'class', 'auto_score', 'manual_score', 'total_score', 'grading_status', 'strikes', 'auto_submitted', 'late', 'elapsed_seconds', 'submitted_at']];
  rows.forEach(function (x) { lines.push([x.student_id, x.student_name, x.class_name || '', x.auto_score, x.manual_score, x.total_score, x.grading_status, x.cheat.strikes, x.cheat.auto_submitted ? 'yes' : 'no', x.cheat.late ? 'yes' : 'no', x.cheat.elapsed_seconds || '', x.submitted_at]); });
  var csv = lines.map(function (l) { return l.map(csvCell).join(','); }).join('\r\n');

    { label: 'ចម្លង', kind: 'soft', onClick: function () { copyText(csv); return false; } },
    { label: 'ទាញយក', kind: 'primary', onClick: function () {
      try {
        var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });

      return false;
    } },
    { label: 'បិទ', kind: 'ghost' }

}
function fmtAnswer(q, a) {
  if (a === null || a === undefined || a === '') return '(មិនបានឆ្លើយ)';
  switch (q.question_type) {
    case 'MCQ': return (q.options[Number(a)] !== undefined) ? q.options[Number(a)] : String(a);
    case 'TRUE_FALSE': return (a === true || String(a).toUpperCase() === 'TRUE') ? 'ពិត' : 'មិនពិត';
    case 'MATCHING': return Array.isArray(a) ? q.options.left.map(function (l, i) { return l + '  →  ' + ((a[i] === null || a[i] === undefined || a[i] === '') ? '—' : q.options.right[Number(a[i])]); }).join('\n') : String(a);
    default: return String(a);
  }
}
function fmtCorrect(q) {
  switch (q.question_type) {
    case 'MCQ': return q.options[q.correct_answer];
    case 'TRUE_FALSE': return q.correct_answer ? 'ពិត' : 'មិនពិត';
    case 'FILL_BLANK': return q.correct_answer.join(' / ');
    case 'MATCHING': return q.options.left.map(function (l, i) { return l + '  →  ' + q.options.right[q.correct_answer[i]]; }).join('\n');
    default: return q.correct_answer || '';
  }
}
function detailModal(subId) {
  safe(function () {
    return api('getSubmissionDetail', subId).then(function (d) {

        h('div', { class: 'flex flex-wrap gap-2 mb-3' }, badge(s.student_id, 'bg-navy-100 text-navy-700'), badge('សរុប ' + num(s.total_score), 'bg-mint-100 text-mint-700'), badge(GRADE_LABEL[s.grading_status] || s.grading_status, GRADE_CLASS[s.grading_status] || '')),
        d.questions.map(function (q, i) {
          var open = q.question_type === 'OPEN_ENDED';
          var sc = open ? (grading[q.question_id] ? grading[q.question_id].score : null) : auto[q.question_id];
          return h('div', { class: 'border border-navy-100 rounded-xl p-3 mb-2' },
            h('div', { class: 'flex justify-between gap-2 text-sm' },
              h('div', { class: 'font-medium pre' }, (i + 1) + '. ' + q.question_text),
              h('div', { class: 'shrink-0 text-xs' }, (sc === null || sc === undefined ? '—' : num(sc)) + ' / ' + num(q.points))),
            h('div', { class: 'text-xs text-slate-500 mt-1' }, TYPE_LABEL[q.question_type]),
            h('div', { class: 'mt-2 text-sm' }, h('b', null, 'ចម្លើយសិស្ស៖ '), h('span', { class: 'pre' }, fmtAnswer(q, d.answers[q.question_id]))),
            !open ? h('div', { class: 'mt-1 text-sm text-mint-700' }, h('b', null, 'ចម្លើយត្រឹមត្រូវ៖ '), h('span', { class: 'pre' }, fmtCorrect(q))) : null,
            (open && grading[q.question_id] && grading[q.question_id].feedback) ? h('div', { class: 'mt-1 text-sm text-navy-700 pre' }, 'មតិ៖ ' + grading[q.question_id].feedback) : null);
        }),
        h('details', { class: 'mt-3 text-xs' }, h('summary', { class: 'cursor-pointer text-slate-500' }, 'កំណត់ត្រាការត្រួតពិនិត្យ'), h('pre', { class: 'pre bg-navy-50 p-2 rounded mt-1' }, JSON.stringify(d.cheat_logs, null, 2))));
      modal(s.student_name, body, [{ label: 'បិទ', kind: 'ghost' }], { wide: true });
    });
  });
}

// ============================================================================
//  VIEW: SPEED-GRADER (open-ended answers)
// ============================================================================
function openGrader(exam) {
  S.view = 'grader';
  S.gr = { exam: exam, data: null, mode: 'question', qi: 0, si: 0, pendingOnly: false, cards: [] };
  render();
  safe(function () { return api('getGradingData', exam.exam_id).then(function (d) { S.gr.data = d; render(); }); });
}
function viewGrader() {
  var g = S.gr, root = h('div', null);
  root.append(h('div', { class: 'flex flex-wrap items-center gap-2 mb-3' },
    btn('← ត្រឡប់ក្រោយ', 'ghost', goList),
    h('h2', { class: 'text-lg font-bold flex-1 min-w-0 truncate' }, 'Speed-Grader៖ ' + g.exam.title)));
  if (!g.data) { root.append(h('p', { class: 'text-slate-500' }, 'កំពុងផ្ទុក…')); return root; }
  var D = g.data;
  if (!D.questions.length) { root.append(h('div', { class: 'bg-white border border-dashed border-navy-200 rounded-2xl p-10 text-center text-slate-500' }, 'ការប្រឡងនេះគ្មានសំណួរឆ្លើយបកវែងទេ។')); return root; }
  if (!D.submissions.length) { root.append(h('div', { class: 'bg-white border border-dashed border-navy-200 rounded-2xl p-10 text-center text-slate-500' }, 'មិនទាន់មានសិស្សដាក់ឆ្លើយទេ។')); return root; }

  var total = 0, done = 0;
  D.submissions.forEach(function (s) { D.questions.forEach(function (q) {
    if (s.answers[q.question_id]) { total++; if (s.grading[q.question_id] && typeof s.grading[q.question_id].score === 'number') done++; }
  }); });

  var modeBtn = function (m, label) { return h('button', { type: 'button', class: 'px-3 py-1.5 text-sm ' + (g.mode === m ? 'bg-navy-800 text-white' : 'bg-white text-navy-800'), onclick: function () { g.mode = m; render(); } }, label); };
  var bar = h('div', { class: 'bg-white rounded-2xl border border-navy-100 shadow-sm p-3 mb-3 flex flex-wrap items-center gap-3' },
    h('div', { class: 'inline-flex rounded-lg overflow-hidden border border-navy-200' }, modeBtn('question', 'តាមសំណួរ'), modeBtn('student', 'តាមសិស្ស')),
    h('label', { class: 'inline-flex items-center gap-2 text-sm' }, h('input', { type: 'checkbox', checked: g.pendingOnly, class: 'accent-emerald-500', onchange: function (ev) { g.pendingOnly = ev.target.checked; render(); } }), 'បង្ហាញតែមិនទាន់ដាក់ពិន្ទុ'),
    h('span', { class: 'text-sm text-slate-600 ml-auto' }, 'បានដាក់ពិន្ទុ ' + done + ' / ' + total));
  root.append(bar);

  var items = [];
  if (g.mode === 'question') {
    var qsel = h('select', { class: 'inp', onchange: function () { g.qi = Number(qsel.value); render(); } },
      D.questions.map(function (q, i) { return h('option', { value: i }, 'សំណួរ ' + (i + 1) + '៖ ' + q.question_text.slice(0, 60)); }));
    qsel.value = g.qi;
    var q0 = D.questions[g.qi] || D.questions[0];
    root.append(h('div', { class: 'mb-3' }, qsel, questionInfo(q0)));
    D.submissions.forEach(function (s) { items.push({ s: s, q: q0 }); });

    root.append(h('div', { class: 'flex items-center gap-2 mb-3' },
      btn('←', 'ghost', function () { g.si = (g.si - 1 + D.submissions.length) % D.submissions.length; render(); }), ssel,
      btn('→', 'ghost', function () { g.si = (g.si + 1) % D.submissions.length; render(); })));
    var s0 = D.submissions[g.si];
    D.questions.forEach(function (q) { items.push({ s: s0, q: q }); });
  }
  if (g.pendingOnly) items = items.filter(function (it) { return !(it.s.grading[it.q.question_id] && typeof it.s.grading[it.q.question_id].score === 'number'); });
  g.cards = [];
  var list = h('div', { class: 'space-y-3' });
  items.forEach(function (it) { list.append(gradeCard(it.s, it.q, g.mode)); });
  if (!items.length) list.append(h('div', { class: 'bg-white border border-dashed border-mint-300 rounded-2xl p-8 text-center text-mint-700' }, 'គ្មានអ្វីត្រូវដាក់ពិន្ទុទៀតទេ 🎉'));
  root.append(list);
  if (items.length) root.append(h('div', { class: 'sticky bottom-3 mt-4 flex justify-end' }, btn('រក្សាទុកពិន្ទុទាំងអស់ដែលបានកែ', 'primary', saveAllGrades, 'shadow-lg px-4 py-2')));
  return root;
}
function questionInfo(q) {
  return h('div', { class: 'mt-3 bg-navy-50 rounded-xl p-3 text-sm' },
    h('div', { class: 'font-medium pre' }, q.question_text),
    h('div', { class: 'text-xs text-slate-500 mt-1' }, 'ពិន្ទុអតិបរមា ' + num(q.points)),
    q.rubric_criteria ? h('div', { class: 'mt-2 pre' }, h('b', null, 'Rubric៖ '), q.rubric_criteria) : null,
    q.correct_answer ? h('div', { class: 'mt-2 pre text-mint-700' }, h('b', null, 'ចម្លើយគំរូ៖ '), q.correct_answer) : null);
}
function gradeCard(s, q, mode) {
  var cur = s.grading[q.question_id];
  var answer = s.answers[q.question_id];
  var card = { s: s, q: q, ai: null, orig: cur && typeof cur.score === 'number' ? String(cur.score) : '', origFb: cur ? (cur.feedback || '') : '' };
  var score = h('input', { class: 'inp w-24', type: 'number', min: 0, max: q.points, step: 0.25, value: card.orig, placeholder: '0–' + num(q.points) });

    state.className = 'text-xs ' + (g && typeof g.score === 'number' ? 'text-mint-700' : 'text-amber-700');
  }
  paintState();
  card.paint = paintState;
  var flags = (s.typing_flags || []).filter(function (f) { return f && f.question_id === q.question_id; });
  var hasFlag = flags.map(function (f) { return badge(f.type === 'paste_attempt' ? '⚠ ព្យាយាមបិទភ្ជាប់' : '⚠ វាយលឿនខុសធម្មតា', 'bg-amber-100 text-amber-700'); });
  var aiBtn = btn('✨ AI ជំនួយ', 'soft', function () {
    if (!S.me.has_gemini_key) { toast('សូមរក្សាទុក Gemini API Key ក្នុងការកំណត់ជាមុនសិន។', 'error'); return; }
    aiBtn.disabled = true;
    safe(function () {
      return api('aiAssistGrade', s.submission_id, q.question_id).then(function (r) {
        score.value = r.suggested_score; fb.value = r.feedback; card.ai = r.suggested_score;
        toast('AI ណែនាំ ' + r.suggested_score + ' / ' + r.max_score + ' ។ សូមពិនិត្យ រួចរក្សាទុក។');
      });
    }).then(function () { aiBtn.disabled = false; });
  });
  if (!answer) aiBtn.style.display = 'none';
  var save = btn('រក្សាទុក', 'primary', function () {
    save.disabled = true;
    safe(function () { return saveCards([card]); }).then(function () { save.disabled = false; });
  });
  S.gr.cards.push(card);
  return h('div', { class: 'bg-white rounded-2xl border border-navy-100 shadow-sm p-4' },
    h('div', { class: 'flex flex-wrap items-center gap-2 mb-2' },
      h('b', null, mode === 'question' ? s.student_name : ('សំណួរ ' + (S.gr.data.questions.indexOf(q) + 1))),
      mode === 'question' ? h('span', { class: 'text-xs font-mono text-slate-500' }, s.student_id) : null,
      cheatBadges(s.cheat), hasFlag, h('span', { class: 'ml-auto' }, state)),
    mode === 'student' ? h('div', { class: 'text-sm text-slate-600 pre mb-2' }, q.question_text) : null,
    h('div', { class: 'bg-navy-50/60 border border-navy-100 rounded-xl p-3 text-sm pre min-h-[3rem] ' + (answer ? '' : 'text-slate-400') }, answer || '(មិនបានឆ្លើយ)'),
    answer ? h('div', { class: 'mt-3 grid sm:grid-cols-[auto_1fr] gap-3 items-start' },
      h('div', null, h('div', { class: 'text-xs text-slate-500 mb-1' }, 'ពិន្ទុ / ' + num(q.points)), score),
      h('div', null, h('div', { class: 'text-xs text-slate-500 mb-1' }, 'មតិយោបល់'), fb)) : null,
    answer ? h('div', { class: 'mt-3 flex gap-2 justify-end' }, aiBtn, save) : null);
}
function cardChanged(c) {
  return c.score.value !== '' && (c.score.value !== c.orig || c.fb.value !== c.origFb);
}
function saveCards(cards) {
  var items = cards.filter(function (c) { return c.score.value !== ''; }).map(function (c) {
    return { submission_id: c.s.submission_id, question_id: c.q.question_id, score: Number(c.score.value), feedback: c.fb.value, by: (c.ai !== null && Number(c.score.value) === c.ai) ? 'ai-assist' : 'teacher' };
  });
  if (!items.length) { toast('សូមបញ្ចូលពិន្ទុជាមុនសិន។', 'error'); return Promise.resolve(); }
  return api('saveGradesBulk', items).then(function (res) {
    var byId = {}; res.forEach(function (r) { byId[r.submission_id] = r; });
    cards.forEach(function (c) {
      if (c.score.value === '') return;
      var r = byId[c.s.submission_id];
      c.s.grading[c.q.question_id] = { score: Number(c.score.value), feedback: c.fb.value, by: (c.ai !== null && Number(c.score.value) === c.ai) ? 'ai-assist' : 'teacher' };
      if (r) { c.s.manual_score = r.manual_score; c.s.total_score = r.total_score; c.s.grading_status = r.grading_status; }
      c.orig = String(Number(c.score.value)); c.origFb = c.fb.value; c.paint();
    });
    toast('បានរក្សាទុក ' + items.length + ' ពិន្ទុ');
  });
}
function saveAllGrades() {
  var changed = S.gr.cards.filter(cardChanged);
  if (!changed.length) { toast('គ្មានការកែប្រែត្រូវរក្សាទុកទេ។'); return; }
  safe(function () { return saveCards(changed); });
}

window.addEventListener('beforeunload', function (ev) {
  if ((S.view === 'editor' && S.ed && S.ed.dirty) || (S.st && S.st.dirty)) { ev.preventDefault(); ev.returnValue = ''; }
});
boot();
