/* ---- Exam App UI Kit (exam-app-ui-kit/ui-kit.css) ---- */
/* ==========================================================================
   Exam App UI Kit — design tokens + reusable components
   Use in Exam.html and Teacher.html (next to Tailwind). Font: Noto Sans Khmer.
   ========================================================================== */
:root{
  --n:#0f2a4a;        /* navy — text, primary buttons */
  --n-700:#173b66; --n-500:#2d6cb5;
  --mu:#64748b;       /* muted text */
  --li:#94a3b8;       /* light text / placeholders */
  --bd:#e6eaf0;       /* borders */
  --sf:#f5f7fa;       /* soft surface */
  --a:#1fae82;        /* mint accent */
  --a-300:#3ccf9f; --a1:#e8f8f2;
  --blue:#1f8fd1;
  --warn:#d97706; --danger:#e11d48;
  --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:22px;
}
body{font-family:"Noto Sans Khmer","Khmer OS Battambang",system-ui,sans-serif;background:#fff;color:var(--n);-webkit-font-smoothing:antialiased}

/* Icon tile (soft / neumorphic) — wrap an SVG icon that uses url(#gi) / url(#gn) / url(#gw) */
.tl{flex:none;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff,#eef2f6);
  box-shadow:6px 6px 14px rgba(15,42,74,.12),-5px -5px 12px #fff,inset 0 1px 0 #fff}
.tl svg{width:50%;height:50%}
.tl-sm{width:32px;height:32px;border-radius:10px}
.tl-lg{width:76px;height:76px;border-radius:22px}

/* Buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;transition:filter .15s,background .15s}
.btn-primary{background:linear-gradient(135deg,var(--n-700),var(--n));color:#fff;box-shadow:0 8px 16px -8px rgba(15,42,74,.6)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:#fff;color:var(--n);border:1px solid var(--bd)}
.btn-ghost:hover{background:var(--sf)}
.btn-ai{background:linear-gradient(135deg,var(--a-300),var(--blue));color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Cards & panels */
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px}
.card-raised{box-shadow:0 20px 40px -24px rgba(15,42,74,.25)}
.panel-navy{border-radius:var(--r-xl);background:linear-gradient(150deg,#1d4a7d,var(--n-700) 40%,var(--n));color:#fff;padding:20px}
.panel-navy .muted{color:#9fb4cc}

/* Input with leading icon */
.field{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:var(--r);padding:4px 14px;background:#fff}
.field:focus-within{border-color:var(--n);box-shadow:0 0 0 3px rgba(15,42,74,.07)}
.field svg{width:18px;height:18px;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;padding:10px 0;color:var(--n);background:none}

/* Segmented control (សិស្ស | គ្រូ) */
.seg{display:inline-flex;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;font:inherit;color:var(--mu);padding:7px 16px;border-radius:8px;cursor:pointer}
.seg .on{background:#fff;color:var(--n);font-weight:600;box-shadow:0 1px 2px rgba(15,42,74,.08)}

/* Badges */
.badge{border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-open{background:var(--a1);color:var(--a)}      /* កំពុងបើក */
.badge-draft{background:#eef3f9;color:var(--n-500)}   /* ព្រាង */
.badge-closed{background:#f1f5f9;color:var(--mu)}     /* បានបិទ */
.badge-review{background:#fff4e5;color:var(--warn)}   /* រង់ចាំពិនិត្យ */
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--a);background:var(--a1);border-radius:99px;padding:3px 10px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--a);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}

/* Exam screen */
.timer{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--n-700),var(--n));color:#fff;border-radius:12px;padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--sf)}.progress>div{height:100%;background:linear-gradient(90deg,var(--a-300),var(--blue));transition:width .3s}
.qchip{width:38px;height:38px;border-radius:12px;border:0;font:inherit;font-weight:700;color:var(--mu);cursor:pointer;
  background:linear-gradient(145deg,#fff,#eef2f6);box-shadow:4px 4px 10px rgba(15,42,74,.1),-3px -3px 8px #fff}
.qchip.answered{color:var(--a);box-shadow:inset 0 0 0 1.5px var(--a),4px 4px 10px rgba(15,42,74,.1)}
.qchip.current{background:linear-gradient(135deg,var(--n-700),var(--n));color:#fff}
.option{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:var(--r);padding:11px 12px;margin-bottom:9px;font:inherit;color:var(--n);cursor:pointer}
.option .letter{flex:none;width:28px;height:28px;border-radius:10px;text-align:center;line-height:28px;font-size:13px;background:linear-gradient(145deg,#fff,#eef2f6);box-shadow:3px 3px 7px rgba(15,42,74,.12),-2px -2px 5px #fff}
.option.selected{border-color:var(--a);background:var(--a1);font-weight:700}
.option.selected .letter{background:linear-gradient(135deg,var(--a-300),var(--blue));color:#fff;box-shadow:none}
.read-lock{display:flex;align-items:center;gap:8px;border-radius:12px;background:#fff8eb;color:#b45309;padding:9px 11px;font-size:12.5px;font-weight:600}

/* Teacher sidebar */
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:var(--mu);padding:7px 8px;border-radius:12px;cursor:pointer;width:100%;text-align:left}
.nav-item.on{background:var(--sf);color:var(--n);font-weight:700}
/* ---- app overrides ---- */
html,body{margin:0;font-family:'Noto Sans Khmer',system-ui,sans-serif;background:#fff;color:#0f2a4a}
.option{margin-bottom:0}
.tl-md{width:64px;height:64px;border-radius:20px}.tl-me{width:42px;height:42px;border-radius:13px}
.tl.mx-auto{margin-left:auto;margin-right:auto}
.option:disabled{opacity:.5;cursor:not-allowed}
.btn{width:auto}
.qchip{flex:none}
.lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.lg i{width:18px;height:18px;border-radius:5px;background:#0f2a4a;position:relative}.lg i:after{content:'';position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:3px;background:#1fae82;border:2px solid #fff}
.rl{list-style:none;margin:0;padding:0}.rl li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#64748b;line-height:1.7;margin-bottom:8px}.rl svg{width:16px;height:16px;flex:none;margin-top:4px}
.scr{margin:18px auto 0;width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff,#eef2f6);box-shadow:8px 8px 18px rgba(15,42,74,.12),-6px -6px 14px #fff}
.scr b{font-size:28px}.scr span{font-size:12px;color:#64748b}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
canvas{display:block;max-width:100%}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
@media (max-width:640px){input,textarea,select{font-size:16px!important}}
@media print{body{display:none!important}}
/* ---- App feel + "install as an app" (PWA) ---- */
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,nav,.nav-item{-webkit-user-select:none;user-select:none}
.app-install{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1.5px dashed #3ccf9f;border-radius:16px;background:#f1fbf7;color:#0f2a4a;font:inherit;cursor:pointer}
.app-install svg{width:34px;height:34px;flex:none}

.app-install-tip{margin-top:8px;font-size:12.5px;color:#475569;background:#f5f7fa;border-radius:12px;padding:10px 12px;line-height:1.8}

// ---------------------------------------------------------------- exam shell
var UI = {};

  UI.progress = h('div', { style: 'width:0' });

  mount(h('div', { class: 'min-h-screen pb-24' }, [
    h('div', { class: 'bg-white sticky top-0 z-30 border-b border-line' }, [

        h('div', { class: 'min-w-0 flex-1' }, [h('div', { class: 'font-bold text-[13.5px] truncate', text: S.exam.title }), UI.strikeLine]),
        UI.timer, submitBtn]),
      h('div', { class: 'progress' }, [UI.progress])]),
    h('div', { class: 'max-w-3xl mx-auto px-4 py-4 space-y-4' }, [
      h('div', { class: 'text-xs text-muted truncate', text: S.name + ' · ' + S.sid }),
      UI.nav,
      h('div', { class: 'border border-line rounded-[18px] p-4 shadow-[0_16px_32px_-24px_rgba(15,42,74,.3)] space-y-3' }, [UI.qhead, UI.canvasWrap, UI.banner, UI.answer])]),
    h('div', { class: 'fixed left-0 right-0 bottom-0 z-30 bg-white border-t border-line', style: 'padding-bottom:env(safe-area-inset-bottom)' }, [

}
function updateStrikeLabel() {
  UI.strikes.textContent = 'ការព្រមាន ' + kh(S.strikes) + '/' + kh(S.exam.max_strikes);
  UI.strikes.className = S.strikes ? 'text-rose-600 font-semibold' : '';
}
function isAnswered(q) {
  var a = S.ans[q.id];

    case 'MATCHING': return Array.isArray(a) && a.length > 0 && a.every(function (x) { return x !== null && x !== undefined && x !== ''; });

}
function renderNav() {
  UI.nav.textContent = '';

    var cls = i === S.cur ? 'qchip current' : (ok ? 'qchip answered' : 'qchip');

}

  renderAnswer();

}
function applyLock() {
  var q = S.qs[S.cur]; if (!q) return;

  UI.banner.className = left > 0 ? 'read-lock' : 'hidden';
  UI.bannerText.textContent = left > 0 ? 'សូមអានសំណួរឱ្យច្បាស់ — អាចឆ្លើយបានក្នុងរយៈពេល ' + kh(left) + ' វិនាទី' : '';
  var els = UI.answer.querySelectorAll('[data-ans]');

// ---------------------------------------------------------------- answer widgets
function setAns(q, v) { S.ans[q.id] = v; renderNav(); }
function optBtn(selected, label, text, onClick) {
  var b = h('button', { type: 'button', 'data-ans': '1', class: 'option' + (selected ? ' selected' : '') }, [
    h('span', { class: 'letter', text: label }),
    h('span', { class: 'flex-1', text: text })]);
  b.addEventListener('click', onClick);
  return b;
}
function renderAnswer() {
  var q = S.qs[S.cur], a = S.ans[q.id], box = UI.answer;
  box.textContent = '';
  if (q.type === 'MCQ') {
    q.options.forEach(function (o, i) {
      box.appendChild(optBtn(a === i, LET[i] || String(i + 1), o, function () { setAns(q, i); renderAnswer(); }));
    });
  } else if (q.type === 'TRUE_FALSE') {
    box.appendChild(optBtn(a === true, '✓', 'ពិត', function () { setAns(q, true); renderAnswer(); }));
    box.appendChild(optBtn(a === false, '✗', 'មិនពិត', function () { setAns(q, false); renderAnswer(); }));
  } else if (q.type === 'FILL_BLANK') {
    var inp = h('input', { class: INP, 'data-ans': '1', maxlength: '300', autocomplete: 'off', placeholder: 'វាយចម្លើយនៅទីនេះ', value: typeof a === 'string' ? a : '' });
    guardInput(inp, q); box.appendChild(inp);
  } else if (q.type === 'MATCHING') {
    var cur = Array.isArray(a) ? a.slice() : q.left.map(function () { return null; });
    q.left.forEach(function (lt, i) {
      var sel = h('select', { class: INP, 'data-ans': '1' }, [h('option', { value: '', text: '— ជ្រើសរើស —' })].concat(
        q.right.map(function (r) { return h('option', { value: String(r.i), text: r.t }); })));
      sel.value = (cur[i] === null || cur[i] === undefined) ? '' : String(cur[i]);
      sel.addEventListener('change', function () {
        var arr = Array.isArray(S.ans[q.id]) ? S.ans[q.id].slice() : q.left.map(function () { return null; });
        arr[i] = sel.value === '' ? null : Number(sel.value);
        setAns(q, arr);

      box.appendChild(h('div', { class: 'rounded-[14px] border border-line p-3 space-y-2' }, [
        h('div', { class: 'font-medium', text: kh(i + 1) + '. ' + lt }), sel]));
    });

    var ta = h('textarea', { class: INP, 'data-ans': '1', rows: '8', placeholder: 'សរសេរចម្លើយរបស់អ្នកនៅទីនេះ…' });

// ---------------------------------------------------------------- typing guards
function flag(q, type, detail) {
  if (S.flags.length >= 100) return;
  S.flags.push({ question_id: q.id, type: type, detail: detail || '' });
}
function guardInput(el, q) {
  var prevLen = el.value.length, lastT = 0;
  ['paste', 'drop', 'cut', 'copy'].forEach(function (ev) {
    el.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'paste' || ev === 'drop') flag(q, 'paste_attempt', ev); });
  });
  el.addEventListener('beforeinput', function (e) {
    var t = e.inputType || '';
    if (t === 'insertFromPaste' || t === 'insertFromDrop' || t === 'insertFromYank' || t === 'insertFromPasteAsQuotation') { e.preventDefault(); flag(q, 'paste_attempt', t); }
  });
  el.addEventListener('input', function () {
    var now = performance.now(), delta = el.value.length - prevLen;
    if (delta >= 15 && now - lastT < 250) flag(q, 'burst', delta + ' chars');
    prevLen = el.value.length; lastT = now;
    S.ans[q.id] = el.value; renderNav();
  });
}

// ---------------------------------------------------------------- timers
function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); var m = Math.floor(sec / 60), s = sec % 60; return kh(('0' + m).slice(-2)) + ':' + kh(('0' + s).slice(-2)); }

  if (!S.started || S.finished) return;
  var left = (S.endAt - performance.now()) / 1000;
  UI.timerText.textContent = fmt(left);
  UI.timer.style.background = left <= 60 ? 'linear-gradient(135deg,#f43f5e,#e11d48)' : '';
  if (left <= 0) {
    S.events.push({ t: Date.now() - S.t0, type: 'time_up', detail: '' });
    showModal([tile('clock', 'tl-md mx-auto mb-3.5'), h('div', { class: 'text-[17px] font-bold text-navy', text: 'អស់ម៉ោងហើយ!' }), h('div', { class: 'mt-2 text-[13px] text-muted leading-relaxed', text: 'កំពុងដាក់ចម្លើយរបស់អ្នកដោយស្វ័យប្រវត្តិ…' })]);

}

}

// ---------------------------------------------------------------- strikes
function trigger(kind) {

}

  var n = S.strikes, max = Number(S.exam.max_strikes) || 3;

  S.paused = true;
  var title = 'ការព្រមាន ' + kh(n) + '/' + kh(max), body, reset = false;
  if (n === 1) body = 'អ្នកបានចាកចេញពីអេក្រង់ប្រឡង។ ការធ្វើបែបនេះម្ដងទៀតនឹងមានផលវិបាកធ្ងន់ធ្ងរជាងនេះ។';
  else { reset = true; body = 'ចម្លើយទាំងអស់របស់អ្នកត្រូវបានលុប ហើយអ្នកត្រូវត្រឡប់ទៅសំណួរទី ១។ ម៉ោងនៅតែបន្តរត់។ ការប្រឡងនឹងត្រូវចាក់សោនៅការព្រមាន ' + kh(max) + '។'; }

    h('div', { class: 'mt-2 text-[13px] text-muted leading-relaxed', text: body }),
    h('button', { class: BTN_P + ' w-full mt-5', text: 'ខ្ញុំយល់ហើយ បន្តប្រឡង', on: { click: resume } })], true);
}
function resume() {

  if (S.fsOK && !fsEl()) tryFS().then(done); else done();

    h('div', { class: 'text-[17px] font-bold text-rose-600', text: 'ការប្រឡងត្រូវបានចាក់សោ' }),
    h('div', { class: 'mt-2 text-[13px] text-muted leading-relaxed', text: 'អ្នកបានចាកចេញពីអេក្រង់ប្រឡងលើសកម្រិតកំណត់។ ចម្លើយរបស់អ្នកកំពុងត្រូវបានដាក់ដោយស្វ័យប្រវត្តិ…' })], true);

// ---------------------------------------------------------------- submit
function confirmSubmit() {
  if (S.finished || S.paused) return;
  var un = S.qs.filter(function (q) { return !isAnswered(q); }).length;
  showModal([
    tile('exam', 'tl-md mx-auto mb-3.5'),
    h('div', { class: 'text-[17px] font-bold text-navy', text: 'ដាក់ការប្រឡង?' }),
    h('div', { class: 'mt-2 text-[13px] text-muted leading-relaxed', text: un ? 'អ្នកនៅមាន ' + kh(un) + ' សំណួរដែលមិនទាន់ឆ្លើយ។ បន្ទាប់ពីដាក់ហើយ មិនអាចកែបានទេ។' : 'បន្ទាប់ពីដាក់ហើយ មិនអាចកែចម្លើយបានទេ។' }),
    h('div', { class: 'mt-5 flex gap-3' }, [
      h('button', { class: BTN_L + ' flex-1', text: 'ត្រឡប់ទៅពិនិត្យ', on: { click: closeModal } }),
      h('button', { class: BTN_P + ' flex-1', text: 'ដាក់ការប្រឡង', on: { click: function () { closeModal(); submit(false); } } })])]);
}
function submit(auto) {
  if (S.finished) return;
  S.finished = true; clearInterval(S.tick); clearInterval(S.clock); clearInterval(S.saver);
  S.payload = { t: S.t, code: S.code, exam_id: S.exam.exam_id, student_id: S.sid, student_name: S.name, answers: S.ans,
    cheat: { strikes: S.strikes, auto_submitted: !!auto, events: S.events, typing_flags: S.flags } };

  send(0);
}
function send(n) {
  mount(card([head('កំពុងដាក់ចម្លើយ…', 'សូមកុំបិទទំព័រនេះ។', 'clock')]));
  api('submitExam', S.payload).then(done).catch(function (e) {
    if (e.network && n < 3) setTimeout(function () { send(n + 1); }, 1500 * (n + 1));
    else if (/រវល់/.test(e.message) && n < 6) setTimeout(function () { send(n + 1); }, 1500 * (n + 1) + Math.floor(Math.random() * 1500));

}
function done(r) {

  if (r && r.show_score) kids.push(h('div', { class: 'scr' }, [h('b', { text: kh(r.score) }), h('span', { text: 'លើ ' + kh(r.max_score) + ' ពិន្ទុ' })]));

  mount(card([head('ដាក់ការប្រឡងរួចរាល់', S.exam ? S.exam.title : '', 'check-circle'), h('div', { class: 'text-center space-y-3' }, kids)]));
}

// ---------------------------------------------------------------- anti-cheat listeners
document.addEventListener('visibilitychange', function () { if (document.hidden) trigger('visibility'); });
window.addEventListener('blur', function () { trigger('blur'); });
document.addEventListener('fullscreenchange', function () { if (S.started && fsEl()) S.fsOK = true; if (S.fsOK && !fsEl()) trigger('fullscreen_exit'); });

['copy', 'cut'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });
document.addEventListener('paste', function (e) { e.preventDefault(); });

  var k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey, block = false;
  if (e.key === 'F12') block = true;
  if (mod && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) block = true;

  if (e.altKey && e.metaKey && (k === 'i' || k === 'j' || k === 'c' || k === 'u')) block = true;

// ---------------------------------------------------------------- boot
if (S.t) showLookup(); else showHome();
})();
